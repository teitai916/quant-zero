<!DOCTYPE html>
<html data-page-node-id="FIhqWoFYr53NtJKG7jwINa" lang="zh-CN">
<head data-page-node-id="7m9YBg45QyRho6CGR3MeGV">
<script data-page-node-id="vCzRY8Zo777hE7dhbi4RSX" src="/page/page_comm/inject.js"></script>
<meta data-page-node-id="w4roQc6yxYJwlzrjkkbIqj" charset="UTF-8">
<meta data-page-node-id="yMXqcEKSCZ62v6GkTOUX8W" content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<title data-page-node-id="D2PVO2tBFKy6mOP6MPQu91" data-pnid-children="nCLa2pWJIQwfNugP5dKiLx">中二学习台</title>
<link data-page-node-id="RuaiqoQLdiap714XN8cBWK" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='55' r='38' fill='%230F766E'/><path d='M50 18 C42 30 58 30 50 42' stroke='%23EA580C' stroke-width='8' fill='none' stroke-linecap='round'/></svg>" rel="icon">
<style data-page-node-id="t0AkVrdUor9kgzDuMgL69C" data-pnid-children="TLvn4yBKtwv3nO2GU42Wyi">
:root{
  --green:#0F766E; --green-d:#115E59; --green-l:#CCFBF1;
  --orange:#EA580C; --ok:#16A34A; --red:#DC2626; --warn:#D97706;
  --bg:#FAF7F0; --card:#FFFFFF; --line:#EDE8DD; --ink:#292524; --ink2:#78716C;
  --serif:"Songti SC","STSong","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  font-family:var(--sans); color:var(--ink);
  font-size:15px; line-height:1.6; min-height:100dvh;
  padding-top:56px; padding-bottom:calc(64px + env(safe-area-inset-bottom));
  background:
    radial-gradient(circle at 15% -10%, rgba(15,118,110,.06), transparent 42%),
    radial-gradient(circle at 110% 8%, rgba(234,88,12,.05), transparent 38%),
    var(--bg);
  background-attachment:fixed;
}
.num{font-variant-numeric:tabular-nums}
button{font-family:var(--sans); border:none; background:none; cursor:pointer; color:inherit; min-width:48px; min-height:48px}
button:focus-visible,[role="button"]:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #5EEAD4;outline-offset:2px}
input,textarea,select{font-family:var(--sans); font-size:16px; color:var(--ink)}

/* ========== 顶部栏 ========== */
header{
  position:fixed; top:0; left:0; right:0; height:56px; z-index:50;
  background:rgba(255,255,255,.86); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:8px; padding:0 14px;
}
header .brand{font-size:17px; font-weight:700; color:var(--green-d); display:flex; align-items:center; gap:8px}
header .brand svg{width:24px;height:24px}
.brand-sub{display:none}
.topnav{display:none; gap:4px; margin:0 auto}
.topnav button{
  padding:8px 18px; border-radius:10px; font-size:15px; color:var(--ink2); font-weight:600;
  display:inline-flex; align-items:center; gap:7px;
}
.topnav button svg{width:18px; height:18px; flex:none}
.topnav button.on{background:var(--green-l); color:var(--green-d)}
.streak{
  margin-left:auto; display:flex; align-items:center; gap:4px;
  background:#FFF7ED; border:1px solid #FED7AA; border-radius:999px; padding:4px 12px;
  font-weight:700; color:var(--orange); font-size:14px;
}
.streak.off{color:#A8A29E; background:#F5F5F4; border-color:#E7E5E4}
.streak svg{width:16px;height:16px}
.gear{width:48px;height:48px; display:flex; align-items:center; justify-content:center; border-radius:10px; color:var(--ink2)}
.gear:active{background:var(--bg)}
.gear svg{width:22px;height:22px}
.gear .gtxt{display:none}

/* ========== 主区 ========== */
main{max-width:960px; margin:0 auto; padding:16px 14px 24px}
.tabpage{display:none}
.tabpage.on{display:block}
.cols{display:block}
.cols>*{min-width:0}
.wc{display:contents}
.tcells{margin-bottom:14px}
.col-side,.col-main{min-width:0}
@media(min-width:768px){
  body{padding-bottom:24px}
  .topnav{display:flex}
  .tabbar{display:none}
  .cols{column-count:2; column-gap:16px}
  .cols .card, .cols .tcells{margin-bottom:16px; break-inside:avoid; page-break-inside:avoid}
  main{padding:22px 20px 32px}
}

/* ========== 卡片 ========== */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:16px;
  box-shadow:0 1px 2px rgba(41,37,36,.04),0 6px 18px rgba(41,37,36,.05);
  padding:16px; margin-bottom:14px;
}
.card h2{font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; margin-bottom:10px; color:var(--ink)}
.card h2 svg{width:24px;height:24px; color:var(--green); background:var(--green-l); border-radius:7px; padding:3px}
.muted{color:var(--ink2); font-size:13px}

/* ========== 今日要处理 ========== */
.todo-item{
  display:flex; align-items:center; gap:10px; padding:12px;
  border-radius:12px; background:#FEF2F2; border:1px solid #FECACA; margin-bottom:8px;
}
.todo-item.amber{background:#FFFBEB; border-color:#FDE68A}
.todo-item .tx{flex:1; min-width:0; font-weight:600; font-size:14px}
.todo-item .btn{flex:none; white-space:nowrap}
.todo-item .cnt{font-size:22px; font-weight:800; color:var(--red)}
.todo-item.amber .cnt{color:var(--warn)}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:48px; padding:0 18px; border-radius:12px; font-size:15px; font-weight:700;
  background:linear-gradient(135deg,#0F766E,#115E59); color:#fff;
  box-shadow:0 2px 8px rgba(15,118,110,.22); transition:transform .1s;
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--green-l); color:var(--green-d); box-shadow:none}
.btn.red{background:linear-gradient(135deg,#EF4444,#DC2626); box-shadow:0 2px 8px rgba(220,38,38,.2)}
.btn.sm{min-height:48px; padding:0 14px; font-size:14px; border-radius:10px}
.btn.block{width:100%}
.btn svg{width:16px;height:16px}

/* 任务清单 */
.task{display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px dashed var(--line)}
.task:last-child{border-bottom:none}
.task .box{
  width:26px; height:26px; border-radius:8px; border:2px solid #D6D3D1; flex:none;
  display:flex; align-items:center; justify-content:center; color:#fff;
}
.task.done .box{background:var(--ok); border-color:var(--ok)}
.task.done .tx{color:var(--ink2); text-decoration:line-through}
.task .box svg{width:16px;height:16px}
.allclear{
  margin-top:8px; text-align:center; padding:10px; border-radius:12px;
  background:var(--green-l); color:var(--green-d); font-weight:700; font-size:14px;
  animation:pop .4s ease;
}
@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}

/* ========== 成就卡 ========== */
.ach-top{display:flex; align-items:center; gap:14px; margin-bottom:12px}
.level-badge{
  width:64px; height:64px; border-radius:18px; flex:none;
  background:linear-gradient(135deg,var(--green),var(--green-d)); color:#fff;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-weight:800;
  box-shadow:0 4px 12px rgba(15,118,110,.25), inset 0 0 0 2px rgba(255,255,255,.16);
}
.level-badge .lv{font-size:12px; opacity:.85}
.level-badge .nm{font-size:14px}
.ach-info{flex:1}
.ach-info .nm{font-weight:800; font-size:17px}
.expbar{height:8px; background:var(--line); border-radius:99px; margin-top:8px; overflow:hidden}
.expbar i{display:block; height:100%; background:linear-gradient(90deg,var(--green),#14B8A6); border-radius:99px; transition:width .5s}
.rings{display:flex; justify-content:space-around; margin-top:6px}
.ring{text-align:center}
.ring svg{width:88px; height:88px}
.ring .lb{font-size:12px; color:var(--ink2); margin-top:2px}
.ring .pc{font-weight:800; font-size:16px}

/* ========== 豆豆 ========== */
.pet-zone{display:flex; align-items:center; gap:12px}
.pet-svg{width:96px; height:96px; flex:none; animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pet-eyes{transform-origin:center; animation:blink 4.2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%,97%{transform:scaleY(.1)}}
.pet-bubble{
  position:relative; background:var(--bg); border:1px solid var(--line); border-radius:12px;
  padding:10px 12px; font-size:13.5px; flex:1;
}
.pet-bubble:before{
  content:""; position:absolute; left:-6px; top:22px; width:10px; height:10px;
  background:var(--bg); border-left:1px solid var(--line); border-bottom:1px solid var(--line);
  transform:rotate(45deg);
}
.pet-bubble b{color:var(--green-d)}

/* ========== 列表项通用 ========== */
.item{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:14px; margin-bottom:10px; box-shadow:0 1px 4px rgba(41,37,36,.05);
  position:relative;
}
.item .row1{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.tag{
  font-size:12px; font-weight:700; padding:2px 10px; border-radius:999px;
  background:var(--green-l); color:var(--green-d); flex:none; white-space:nowrap;
}
.tag.red{background:#FEE2E2; color:var(--red)}
.tag.amber{background:#FEF3C7; color:#92400E}
.tag.gray{background:#F5F5F4; color:#A8A29E}
.chip{
  min-height:48px; padding:6px 14px; border-radius:999px; font-size:13.5px; font-weight:600;
  background:var(--card); border:1.5px solid var(--line); color:var(--ink2);
}
.chip.on{background:var(--green); border-color:var(--green); color:#fff}
.chips{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px}

/* ========== 作业 ========== */
.hw-check{
  width:48px; height:48px; flex:none; position:relative; background:none;
  display:flex; align-items:center; justify-content:center; color:#fff;
}
.hw-check:before{
  content:""; position:absolute; inset:0; margin:auto;
  width:20px; height:20px; border-radius:50%; border:2px solid #D6D3D1;
  transition:.2s;
}
.hw-check svg{width:11px; height:11px; position:relative; z-index:1}
.hw-item{display:flex; gap:12px; align-items:center}
.hw-tag{float:right; margin:3px 0 4px 8px}
.hw-item .tx{flex:1; min-width:0}
.hw-item .tx .t{font-weight:600}
.hw-item.done .tx .t{color:var(--ink2); text-decoration:line-through}
.hw-item.done .hw-check:before{background:var(--ok); border-color:var(--ok)}
.hw-meta{font-size:12.5px; color:var(--ink2); margin-top:3px}
.hw-del{color:#A8A29E; padding:6px; flex:none; width:48px; height:48px; display:inline-flex; align-items:center; justify-content:center}
.hw-del svg{width:18px;height:18px}
.hw-del.ask{color:var(--red); font-size:12.5px; font-weight:700}
.stamp{
  position:absolute; right:12px; top:50%; margin-top:-26px;
  border:3px solid var(--red); color:var(--red); border-radius:10px;
  font-size:20px; font-weight:900; padding:2px 12px; transform:rotate(-12deg) scale(2.4);
  opacity:0; pointer-events:none; letter-spacing:4px;
}
.stamp.show{animation:stampIn .45s ease forwards}
@keyframes stampIn{0%{opacity:0; transform:rotate(-12deg) scale(2.4)}60%{opacity:1; transform:rotate(-12deg) scale(.92)}100%{opacity:.92; transform:rotate(-12deg) scale(1)}}

/* ========== 表单 ========== */
.form-row{margin-bottom:12px}
.form-row label{display:block; font-size:13px; font-weight:700; color:var(--ink2); margin-bottom:6px}
.form-row input[type=text],.form-row textarea,.form-row input[type=date]{
  width:100%; border:1.5px solid var(--line); border-radius:12px; padding:12px 14px;
  background:#FDFDFC; outline:none; font-size:16px;
}
.form-row input:focus,.form-row textarea:focus{border-color:var(--green)}
.form-row textarea{min-height:64px; resize:vertical}

/* ========== 记忆 ========== */
.subtabs{display:flex; gap:8px; margin-bottom:14px; background:var(--line); padding:4px; border-radius:12px}
.subtabs button{flex:1; min-height:48px; border-radius:9px; font-weight:700; font-size:14.5px; color:var(--ink2)}
.subtabs button.on{background:var(--card); color:var(--green-d); box-shadow:0 1px 3px rgba(0,0,0,.08)}
.mem-item{display:flex; align-items:center; gap:10px; cursor:pointer; width:100%; text-align:left; min-height:72px}
.mem-item .tx{flex:1; min-width:0}
.mem-item .t{font-weight:700}
.mem-item .s{font-size:12.5px; color:var(--ink2)}
.mem-item .arrow{color:#D6D3D1; flex:none}
.mem-item .arrow svg{width:18px;height:18px}
.mem-item.grad{opacity:.62}

/* ========== overlay ========== */
.overlay{
  position:fixed; inset:0; z-index:100; background:var(--bg);
  display:none; flex-direction:column; height:100dvh;
}
.overlay.on{display:flex}
.ov-head{
  height:56px; flex:none; display:flex; align-items:center; gap:10px; padding:0 14px;
  background:var(--card); border-bottom:1px solid var(--line);
}
.ov-back{width:48px;height:48px; display:flex; align-items:center; justify-content:center; border-radius:10px; color:var(--ink)}
.ov-back svg{width:22px;height:22px}
.ov-title{font-weight:800; font-size:16px; flex:1; text-align:center; padding-right:50px}
.ov-body{flex:1; overflow-y:auto; padding:18px 16px 24px; max-width:720px; margin:0 auto; width:100%}
.ov-foot{
  flex:none; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:var(--card); border-top:1px solid var(--line);
  display:flex; gap:12px; max-width:720px; margin:0 auto; width:100%;
}
.ov-foot .btn{flex:1; min-height:56px; font-size:16px}
.poem-text{
  font-family:var(--serif); font-size:19px; line-height:2.1; text-align:center;
  background:var(--card); border:1px solid var(--line); border-radius:14px; padding:22px 16px;
}
.poem-text .ln{display:block; cursor:pointer; transition:.2s; min-height:48px; padding:8px 0}
.poem-text .ln.masked{color:transparent; text-shadow:none; background:#E7E5E4; border-radius:8px; margin:6px 30px; user-select:none}
.poem-text .ln.masked:active{background:#D6D3D1}
.poem-author{text-align:center; color:var(--ink2); font-size:13.5px; margin-bottom:12px}
.tool-row{display:flex; gap:10px; justify-content:center; margin:14px 0}
.word-card{
  perspective:1000px; height:240px; margin:26px 0; cursor:pointer;
}
.word-inner{
  position:relative; width:100%; height:100%; transition:transform .45s;
  transform-style:preserve-3d;
}
.word-card.flipped .word-inner{transform:rotateY(180deg)}
.word-face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  background:var(--card); border:1px solid var(--line); border-radius:18px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  box-shadow:0 4px 14px rgba(41,37,36,.07);
}
.word-face .w{font-size:38px; font-weight:800; letter-spacing:1px}
.word-face .ph{color:var(--ink2); font-size:16px}
.word-face.back{transform:rotateY(180deg)}
.word-face .pos{color:var(--green); font-weight:700}
.word-face .def{font-size:19px; font-weight:600}
.word-hint{text-align:center; color:var(--ink2); font-size:12.5px}

/* ========== 错题 ========== */
.mk-cause{font-size:12px; font-weight:700; padding:2px 10px; border-radius:999px; background:#FEF3C7; color:#92400E}
.mk-ans{margin-top:8px; padding:10px 12px; background:#F0FDF4; border-radius:10px; font-size:13.5px; display:none}
.mk-ans.show{display:block}
.mk-toggle{font-size:12.5px; color:var(--green); font-weight:700; margin-top:8px; display:inline-flex; align-items:center; padding:0 10px}

/* ========== 底部 Tab ========== */
.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:var(--card); border-top:1px solid var(--line);
  display:flex; padding-bottom:env(safe-area-inset-bottom);
}
.tabbar button{
  flex:1; min-height:56px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2px; font-size:11px; font-weight:600; color:var(--ink2);
}
.tabbar button.on{color:var(--green)}
.tabbar svg{width:22px;height:22px}

/* ========== 设置抽屉 ========== */
.drawer-mask{position:fixed; inset:0; background:rgba(41,37,36,.4); z-index:90; display:none}
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:min(340px,88vw); z-index:95;
  background:var(--bg); box-shadow:-4px 0 20px rgba(0,0,0,.1);
  transform:translateX(100%); transition:transform .25s ease, visibility 0s linear .25s;
  visibility:hidden; overflow-y:auto;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom));
}
.drawer-mask.on{display:block}
.drawer.on{transform:translateX(0); visibility:visible; transition:transform .25s ease}
.drawer h3{font-size:16px; margin-bottom:16px; display:flex; align-items:center; justify-content:space-between}
.dr-item{
  background:var(--card); border:1px solid var(--line); border-radius:12px;
  padding:14px; margin-bottom:10px; font-size:14px;
}
.dr-item .t{font-weight:700; margin-bottom:4px; display:flex; align-items:center; gap:6px}
.dr-item .t svg{width:16px;height:16px; color:var(--green)}
.dr-item .d{font-size:12.5px; color:var(--ink2); margin-bottom:8px}
.dr-btns{display:flex; gap:8px}
.hold-btn{position:relative; overflow:hidden}
.hold-btn .prog{position:absolute; inset:0; background:rgba(220,38,38,.25); width:0%}
.guide{font-size:12.5px; color:var(--ink2); line-height:1.8}
.guide b{color:var(--ink)}

/* ========== toast ========== */
#toast{
  position:fixed; left:50%; bottom:calc(80px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#fff; padding:10px 20px; border-radius:999px; font-size:14px; font-weight:600;
  opacity:0; pointer-events:none; transition:.3s; z-index:200; white-space:normal;
  max-width:min(90vw,520px); width:max-content; text-align:center; line-height:1.5;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

/* ========== 战报 ========== */
.rep-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0}
.rep-cell{background:var(--bg); border-radius:12px; padding:12px; text-align:center}
.rep-cell .n{font-size:24px; font-weight:800; color:var(--green-d)}
.rep-cell .l{font-size:12px; color:var(--ink2)}
.heat{display:flex; gap:6px; justify-content:space-between; margin:10px 0}
.heat .hcell{flex:1; text-align:center}
.heat .sq{height:34px; border-radius:8px; background:var(--line); margin-bottom:4px; display:flex; align-items:center; justify-content:center; color:#fff}
.heat .sq.lv1{background:#99F6E4}.heat .sq.lv2{background:#2DD4BF}.heat .sq.lv3{background:var(--green)}
.heat .wd{font-size:11px; color:var(--ink2)}
canvas#posterCanvas{display:none}
#posterImg{width:100%; border-radius:14px; border:1px solid var(--line)}

/* ========== PBL 项目向导 ========== */
.pj-wiz{
  border:2px dashed var(--green); border-radius:14px; background:#F0FDFA;
  padding:16px; margin-bottom:14px; cursor:pointer; text-align:center; width:100%;
  transition:transform .1s;
}
.pj-wiz:active{transform:scale(.98)}
.pj-wiz .t{font-weight:800; color:var(--green-d); font-size:15px}
.pj-wiz .d{font-size:12.5px; color:var(--ink2); margin-top:2px}
.pj-card{border-left:4px solid var(--green)}
.pj-card .pj-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.pj-card .pj-name{font-weight:800; flex:1; min-width:0}
.pj-stage{margin:10px 0 6px; font-size:13px; color:var(--ink2)}
.pj-stage b{color:var(--green-d)}
.tpl-item{cursor:pointer; width:100%; text-align:left; display:block}
.output-check{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 0;font-weight:600}
.output-check .box{width:28px;height:28px;border:2px solid #D6D3D1;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.output-check.done .box{background:var(--ok);border-color:var(--ok)}
.compare{font-size:12px;color:var(--ink2);margin-top:2px}
.tpl-item .goal{font-size:13px; color:var(--ink2); margin-top:4px}
.tpl-meta{display:flex; gap:6px; margin-top:8px}
.pbl-sec{margin-bottom:16px}
.pbl-sec .lb{font-size:13px; font-weight:700; color:var(--ink2); margin-bottom:6px}
.pbl-safety{background:#FFFBEB; border:1px solid #FDE68A; border-radius:12px; padding:10px 12px; font-size:13.5px}
.pbl-stage-h{display:flex; align-items:center; gap:8px; margin:14px 0 6px}
.pbl-stage-h .no{width:24px; height:24px; border-radius:50%; background:var(--green); color:#fff; font-size:12.5px; font-weight:800; display:flex; align-items:center; justify-content:center; flex:none}
.pbl-stage-h .nm{font-weight:800}
.pbl-task{display:flex; gap:8px; padding:8px 0 8px 32px; font-size:14px; align-items:baseline}
.pbl-task .day{flex:none; font-size:12px; font-weight:700; color:var(--warn)}

/* ========== 页头（今日） ========== */
.page-head{margin-bottom:14px}
.ph-date{font-size:13px; color:var(--ink2); font-weight:600}
.ph-hi{font-size:21px; font-weight:800; line-height:1.35}
.ph-stats{display:none; gap:10px; flex-wrap:wrap}
.ph-chip{
  display:inline-flex; align-items:center; gap:6px; background:var(--card);
  border:1px solid var(--line); border-radius:999px; padding:7px 14px;
  font-size:13px; color:var(--ink2); font-weight:600;
  box-shadow:0 1px 2px rgba(41,37,36,.04);
}
.ph-chip svg{width:15px; height:15px; color:var(--green)}
.ph-chip b{color:var(--ink); font-size:15px}
.ph-chip.warn svg{color:var(--red)}
.ph-chip.fire svg{color:var(--orange)}
.todo-sub{font-size:12.5px; color:var(--ink2); font-weight:400; margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ach-heat{border-top:1px dashed var(--line); margin-top:14px; padding-top:4px}
.rep-mini{display:flex; gap:8px; margin-bottom:12px}
.rm-cell{flex:1; background:var(--bg); border-radius:10px; padding:9px 4px; text-align:center}
.rm-cell b{display:block; font-size:19px; color:var(--green-d)}
.rm-cell span{font-size:11.5px; color:var(--ink2)}
.feed-row{display:flex; gap:10px; padding:7px 0; border-bottom:1px dashed var(--line); font-size:13.5px}
.feed-row:last-child{border-bottom:none}
.feed-row .fd{flex:none; color:var(--ink2); font-size:12.5px; min-width:52px; padding-top:1px}
.feed-row .fp{flex:1}

/* ========== hero 行动卡 ========== */
.card.hero{
  background:linear-gradient(180deg,#F6FAF5,#FFFFFF 72%);
  border:1.5px solid #CFE5D5; border-radius:18px; padding:18px;
}
.card.hero h2{font-size:16px}
.hero-grp{margin-bottom:16px}
.hero-grp:last-child{margin-bottom:0}
.hg-head{display:flex; align-items:center; gap:8px; margin-bottom:9px; font-weight:800; font-size:14px}
.hg-dot{width:8px; height:8px; border-radius:50%; background:var(--warn); flex:none}
.hg-dot.red{background:var(--red)}
.hg-n{background:var(--red); color:#fff; font-size:12px; border-radius:99px; padding:1px 9px; font-weight:800}
.hg-go{margin-left:auto; font-size:12.5px; color:var(--green); font-weight:700; min-height:0; min-width:0; padding:4px 6px; border-radius:8px}
.hero-row{
  display:flex; align-items:center; gap:9px; padding:10px 12px;
  background:var(--card); border:1px solid var(--line); border-radius:12px; margin-bottom:6px;
}
.hero-row .hr-tx{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; font-size:13.5px}
.hero-row .hr-due{flex:none; font-size:12px; color:var(--ink2)}
.hero-row .hr-due.red{color:var(--red); font-weight:700}
.mem-chips{display:flex; flex-wrap:wrap; gap:8px}
.mem-chip{
  min-height:38px; padding:7px 15px; border-radius:999px;
  background:var(--green-l); color:var(--green-d); font-weight:700; font-size:13.5px;
}
.hero-clear{
  display:flex; gap:14px; align-items:center;
  background:#F0FDF4; border:1px solid #BBE7C8; border-radius:14px; padding:16px;
}
.hero-clear b{color:#15803D}
.hc-ic{width:44px; height:44px; flex:none; border-radius:50%; background:var(--ok); color:#fff; display:flex; align-items:center; justify-content:center}
.hc-ic svg{width:22px; height:22px}

/* ========== 任务三格 ========== */
.tcells{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.tcell{
  border:1.5px solid var(--line); border-radius:14px; padding:14px 8px 12px;
  text-align:center; background:var(--card);
  box-shadow:0 1px 2px rgba(41,37,36,.04);
}
.tcell .tc-ic{
  width:34px; height:34px; margin:0 auto 6px; border-radius:50%;
  background:var(--line); color:#fff; display:flex; align-items:center; justify-content:center;
}
.tcell .tc-ic svg{width:18px; height:18px}
.tcell .tc-lb{font-weight:700; font-size:13px; display:block}
.tcell .tc-st{font-size:11.5px; color:var(--ink2)}
.tcell.done{border-color:#BBE7C8; background:#F2FBF3}
.tcell.done .tc-ic{background:var(--ok)}
.tcell.done .tc-st{color:var(--ok); font-weight:700}
@media(min-width:768px){
  .page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:18px}
  .ph-stats{display:flex}
}

/* ========== 分栏网格（作业/记忆/错题） ========== */
.page-grid{display:grid; grid-template-columns:1fr; gap:14px}
.ctl-card{background:transparent; border:none; box-shadow:none; padding:0; margin-bottom:14px}
.ctl-card h2{display:none}

/* ========== 悬停精细交互（仅桌面指针设备） ========== */
@media(hover:hover) and (pointer:fine){
  .btn:hover{filter:brightness(1.07)}
  .btn.ghost:hover{filter:none; background:#B8F2E9}
  .chip:hover{border-color:#C7C2B8; color:var(--ink)}
  .chip.on:hover{color:#fff}
  .item{transition:box-shadow .15s, transform .15s}
  button.item:hover{transform:translateY(-1px); box-shadow:0 5px 16px rgba(41,37,36,.09)}
  .hw-check:hover:before{border-color:var(--green)}
  .topnav button:hover:not(.on){background:#F3EFE6}
  .tabbar button:hover{color:var(--green)}
  .pj-wiz:hover{background:#E4FAF4}
  .ov-back:hover{background:var(--bg)}
  .gear:hover{background:var(--bg)}
  .hw-del:hover{color:var(--red)}
  .hg-go:hover{background:var(--green-l)}
  .mem-chip:hover{background:#9FE8D8}
  .hero-row:hover{border-color:#C7C2B8}
  .word-card .word-face{transition:box-shadow .2s}
  .word-card:hover .word-face{box-shadow:0 8px 24px rgba(41,37,36,.12)}
}

  body{padding-top:0; padding-bottom:0; padding-left:236px}

  .topnav button svg{width:19px; height:19px}

  .gear .gtxt{display:inline}

  main{max-width:1160px; padding:28px 36px 44px}
  .page-grid{grid-template-columns:350px minmax(0,1fr); gap:16px; align-items:start}
  .col-side{position:sticky; top:28px}
  .ctl-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px;
    box-shadow:0 1px 2px rgba(41,37,36,.04),0 6px 18px rgba(41,37,36,.05)}
  .ctl-card h2{display:flex}
  .ph-hi{font-size:27px}
  .ph-date{font-size:14px}
  .level-badge{width:72px; height:72px}
  .ring svg{width:100px; height:100px}
  .pet-svg{width:126px; height:126px}
  .todo-item{padding:14px}
  #toast{bottom:32px}
  /* 弹层改居中模态 */

  .ov-head{width:min(760px,100%); border:1px solid var(--line); border-radius:18px 18px 0 0; box-shadow:0 24px 60px rgba(41,37,36,.2)}
  .ov-body{width:min(760px,100%); max-width:none; margin:0; flex:0 1 auto; background:var(--bg);

  .ov-foot .btn{min-height:50px}
  .poem-text{font-size:21px; padding:28px 24px}

  .word-card{height:300px; max-width:440px; margin-left:auto; margin-right:auto}
  .pet-svg{width:110px; height:110px}
  .ov-body::-webkit-scrollbar, .drawer::-webkit-scrollbar{width:8px}
  .ov-body::-webkit-scrollbar-thumb, .drawer::-webkit-scrollbar-thumb{background:#D6D3D1; border-radius:99px}
  .ov-body::-webkit-scrollbar-track, .drawer::-webkit-scrollbar-track{background:transparent}
}
@media(min-width:1400px){
  main{max-width:1280px}
  #memList{display:grid; grid-template-columns:1fr 1fr; gap:0 12px}
}

}

{id:"p1",title:"观沧海",author:"曹操",dyn:"东汉末",book:"课内诗歌",lines:["东临碣石，以观沧海。","水何澹澹，山岛竦峙。","树木丛生，百草丰茂。","秋风萧瑟，洪波涌起。","日月之行，若出其中；","星汉灿烂，若出其里。","幸甚至哉，歌以咏志。"]},
{id:"p2",title:"闻王昌龄左迁龙标遥有此寄",author:"李白",dyn:"唐",book:"课内诗歌",lines:["杨花落尽子规啼，","闻道龙标过五溪。","我寄愁心与明月，","随君直到夜郎西。"]},

const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
function dstr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function today(){return dstr(new Date())}
function addDays(ds,n){const d=new Date(ds+"T12:00:00"); d.setDate(d.getDate()+n); return dstr(d)}
function dlabel(ds){const t=today(); if(ds===t)return"今天"; if(ds===addDays(t,1))return"明天"; if(ds<t)return"已逾期"; const d=new Date(ds+"T12:00:00"); return (d.getMonth()+1)+"月"+d.getDate()+"日"}
function pastLabel(ds){const t=today(); if(ds===t)return"今天"; if(ds===addDays(t,-1))return"昨天"; const d=new Date(ds+"T12:00:00"); return (d.getMonth()+1)+"月"+d.getDate()+"日"}
function uid(){return "id"+Date.now().toString(36)+Math.floor(Math.random()*999)}
let toastTimer=null;
function toast(msg){const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),1800)}

function rowToMemory(row){
  var g=function(k){var v=row[k];if(v==null)return null;if(typeof v==='object'&&v.text!=null)return v.text;return v};
  var content=g('内容')||'';
  var typ=g('类型'); var isP=typ==='古诗文';
  var item=isP?POEMS.find(x=>x.title===content):WORDS.find(x=>x.w===content);
  var id=item?item.id:null;
  var stxt=g('状态')||'需复习';
  var lv= stxt==='已掌握'?4 : stxt==='新学'?0 : 1;
  var next=g('下次复习'); if(typeof next==='object'&&next!=null)next=next.date||next.text||''; if(next)next=String(next).slice(0,10);
  var nextDate = (stxt==='已掌握')?null:(next||today());
  return {id:id, lv:lv, next:nextDate, wrongToday:{date:null,count:0}};
}
function pullRemoteMemory(cb){
  if(!ONLINE||LOCAL_ONLY){if(cb)cb(false);return}
  var allRows=[],cursor=null;
  function fetchPage(){
    _db.query({databaseId:DATABASE_ID_MEM,pageSize:100,startCursor:cursor,sorts:[{property:'日期',direction:'descending'}]}).then(function(result){
      allRows=allRows.concat(result.results||[]);
      if(result.hasMore&&result.nextCursor){cursor=result.nextCursor;fetchPage()}
      else{
        var seen={};
        var recs=allRows.map(rowToMemory).filter(function(r){return r&&r.id});
        recs.forEach(function(r){if(!(r.id in seen)){seen[r.id]=r}});
        Object.keys(seen).forEach(function(id){ if(!(id in state.memory)){state.memory[id]=seen[id]} });
        save();
        if(cb)cb(true,recs.length)
      }
    }).catch(function(err){console.error('[database] memory pull failed:',err);if(cb)cb(false)})
  }
  fetchPage()
}

function migrateState(obj){
  state=Object.assign(defaultState(),obj,{version:2});
  state.settings=Object.assign(defaultState().settings,obj.settings||{});
  state.meta=Object.assign(defaultState().meta,obj.meta||{});
  if(!Array.isArray(state.projects))state.projects=[];
  if(!Array.isArray(state.log))state.log=[];
  if(!Array.isArray(state.checkins))state.checkins=[];
  if(!Array.isArray(state.meta.userActionDates))state.meta.userActionDates=[];
  Object.keys(state.memory||{}).forEach(id=>{
    const m=state.memory[id];
    if(typeof m.wrongToday==="number")m.wrongToday={date:null,count:0};
    else if(!m.wrongToday||typeof m.wrongToday!=="object")m.wrongToday={date:null,count:0};
  });
  const hasLegacySample=state.homework.some(x=>x&&x.sample)||state.mistakes.some(x=>x&&x.sample)||state.settings.installedSample;
  if(hasLegacySample&&!state.sampleBaseline){
    const seed=(state.homework.find(x=>x&&x.id==="h1")||{}).created||today();
    const specs=[[-2,"hw"],[-2,"pn"],[-1,"pr"],[-1,"mr"],[-1,"hw"],[0,"hw"]];
    const used=new Set();
    specs.forEach(([off,type])=>{
      const idx=state.log.findIndex((l,i)=>!used.has(i)&&l&&l.d===addDays(seed,off)&&l.t===type&&!l.sample);
      if(idx>=0){state.log[idx].sample=true;used.add(idx)}
    });
    state.sampleBaseline={
      exp:82,
      memory:{
        p1:{lv:1,next:addDays(seed,1),wrongToday:{date:null,count:0}},
        p3:{lv:2,next:seed,wrongToday:{date:null,count:0}},
        w1:{lv:1,next:seed,wrongToday:{date:null,count:0}},
        w2:{lv:2,next:addDays(seed,2),wrongToday:{date:null,count:0}}
      },
      checkins:[addDays(seed,-2),addDays(seed,-1),seed]
    };
    state.settings.installedSample=true;
    state.log.filter(l=>l&&!l.sample&&state.sampleBaseline.checkins.includes(l.d)).forEach(l=>{
      if(!state.meta.userActionDates.includes(l.d))state.meta.userActionDates.push(l.d);
    });
  }
  state.projects.forEach(p=>{if(!Array.isArray(p.outputChecks))p.outputChecks=[]});
}
function load(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw){state=defaultState(); seedSample(); save(); return}
    migrateState(JSON.parse(raw));
  }catch(e){
    try{localStorage.setItem(LS_KEY+"_broken",localStorage.getItem(LS_KEY)||"")}catch(_){}
    state=defaultState();
    alert("数据异常，已为你开了新本子。");
  }
  state.meta.lastOpenDate=today(); save();
}
function checkin(){const t=today(); if(!state.checkins.includes(t)){state.checkins.push(t)} }
function markUserAction(){const t=today(); if(!state.meta.userActionDates.includes(t))state.meta.userActionDates.push(t)}
function addExp(n,logType){
  state.exp+=n; const before=levelOf(state.exp-n).idx, after=levelOf(state.exp).idx;
  if(logType){state.log.push({d:today(),t:logType}); if(state.log.length>500)state.log=state.log.slice(-500)}
  markUserAction(); checkin(); save();
  if(n>0){if(after>before){toast("升级了！「"+LEVELS[after].name+"」")}else{toast("+"+n+" 经验")}}
}
function calcStreak(){
  let cur=0; let d=new Date();
  if(!state.checkins.includes(dstr(d))){d.setDate(d.getDate()-1)}
  while(state.checkins.includes(dstr(d))){cur++; d.setDate(d.getDate()-1)}
  return cur;
}
function levelOf(exp){
  let idx=0; for(let i=0;i<LEVELS.length;i++){if(exp>=LEVELS[i].exp)idx=i}
  const cur=LEVELS[idx], next=LEVELS[idx+1];
  return {idx, name:cur.name, next, prog: next? Math.min(1,(exp-cur.exp)/(next.exp-cur.exp)) : 1};
}

    {d:addDays(t,-6),t:"hw",sample:true},{d:addDays(t,-6),t:"pr",sample:true},{d:addDays(t,-6),t:"ma",sample:true},
    {d:addDays(t,-5),t:"hw",sample:true},{d:addDays(t,-5),t:"wn",sample:true},{d:addDays(t,-5),t:"mr",sample:true},
    {d:addDays(t,-4),t:"hw",sample:true},{d:addDays(t,-4),t:"wr",sample:true},
    {d:addDays(t,-3),t:"hw",sample:true},{d:addDays(t,-3),t:"pn",sample:true},{d:addDays(t,-3),t:"pr",sample:true},
    {d:addDays(t,-2),t:"hw",sample:true},{d:addDays(t,-2),t:"wn",sample:true},{d:addDays(t,-2),t:"mr",sample:true},{d:addDays(t,-2),t:"ma",sample:true},
    {d:addDays(t,-1),t:"hw",sample:true},{d:addDays(t,-1),t:"pr",sample:true},{d:addDays(t,-1),t:"wr",sample:true},{d:addDays(t,-1),t:"mr",sample:true}
  ];
  state.settings.installedSample=true;
  state.sampleBaseline={exp:410,memory:JSON.parse(JSON.stringify(state.memory)),checkins:state.checkins.slice()};
}
function clearSample(){
  const baseline=state.sampleBaseline||{exp:0,memory:[],checkins:[]};
  state.homework=state.homework.filter(x=>!x.sample);
  state.mistakes=state.mistakes.filter(x=>!x.sample);
  state.projects=state.projects.filter(p=>!p.sample);
  const sampleMemory=baseline.memory||{};
  if(Array.isArray(sampleMemory))sampleMemory.forEach(id=>delete state.memory[id]);
  else Object.entries(sampleMemory).forEach(([id,initial])=>{
    if(JSON.stringify(state.memory[id])===JSON.stringify(initial))delete state.memory[id];
  });
  state.exp=Math.max(0,state.exp-(Number(baseline.exp)||0));
  state.log=state.log.filter(l=>!l.sample);
  const keepDates=new Set([...(state.meta.userActionDates||[]),...state.log.map(l=>l.d)]);
  state.checkins=state.checkins.filter(d=>!(baseline.checkins||[]).includes(d)||keepDates.has(d));
  state.settings.installedSample=false; state.sampleBaseline=null;
  save(); renderAll();
  toast("预置作业、记忆、错题和成长记录已清空");
}

/* ==================== 引擎：作业/记忆/错题 ==================== */
function hwPending(){return state.homework.filter(h=>!h.done).sort((a,b)=>a.due<b.due?-1:1)}
function hwDueSoon(){const t=today(); return hwPending().filter(h=>h.due<=addDays(t,1))}
function hwDoneList(){return state.homework.filter(h=>h.done).sort((a,b)=>(b.doneDate||"")<(a.doneDate||"")?-1:1)}
function memProg(id){return state.memory[id]||{lv:0,next:null,wrongToday:{date:null,count:0}}}
function memWrongCount(m){return m.wrongToday&&m.wrongToday.date===today()?m.wrongToday.count||0:0}
function memCanAct(m){return memWrongCount(m)<2&&(m.lv===0||(m.lv>=1&&m.lv<=3&&m.next&&m.next<=today()))}
function memDue(){const t=today(); const out=[];
  POEMS.forEach(p=>{const m=memProg(p.id); if(m.lv>=1&&m.lv<=3&&m.next&&m.next<=t&&memWrongCount(m)<2)out.push({kind:"p",item:p})});
  WORDS.forEach(w=>{const m=memProg(w.id); if(m.lv>=1&&m.lv<=3&&m.next&&m.next<=t&&memWrongCount(m)<2)out.push({kind:"w",item:w})});
  return out;
}
function memGradCount(){let n=0; POEMS.concat(WORDS).forEach(it=>{if(memProg(it.id).lv>=4)n++}); return n}
function mkDue(){const t=today(); return state.mistakes.filter(m=>m.lv>=1&&m.lv<=4&&m.next&&m.next<=t)}
function mkMastered(){return state.mistakes.filter(m=>m.lv>=5).length}
function memAction(id,ok){
  const m=memProg(id);
  if(!memCanAct(m))return false;
  if(ok){
    m.lv=m.lv+1; m.wrongToday={date:null,count:0};
    if(m.lv>=4){m.lv=4; m.next=null; toast("已会背，毕业！")}
    else{m.next=addDays(today(),MEM_GAP[m.lv])}
  }else{
    const count=memWrongCount(m)+1;
    m.lv=1; m.wrongToday={date:today(),count};
    m.next=count>=2?addDays(today(),1):today();
  }
  state.memory[id]=m; return true;
}
function mkAction(id,ok){
  const m=state.mistakes.find(x=>x.id===id); if(!m)return;
  if(ok){m.lv+=1; if(m.lv>=5){m.lv=5;m.next=null; toast("已掌握，出库！")} else m.next=addDays(today(),MK_GAP[m.lv])}
  else{m.lv=1; m.next=addDays(today(),1)}
}

/* ==================== 渲染：作业 ==================== */
let hwFilter="全部", hwDoneOpen=false;
function pjActive(){return state.projects[state.projects.length-1]}
function pjTasks(pjId){return state.homework.filter(h=>h.project===pjId)}
function projectOutputs(tpl){return String(tpl.output).split(/\s*[＋+]\s*/).filter(Boolean)}
function ensureProjectOutputs(pj,tpl){
  const labels=projectOutputs(tpl);
  if(!Array.isArray(pj.outputChecks)||pj.outputChecks.length!==labels.length){
    const old=new Map((pj.outputChecks||[]).map(x=>[x.label,!!x.done]));
    pj.outputChecks=labels.map(label=>({label,done:old.get(label)||false}));
  }
  return pj.outputChecks;
}
function pjSectionHtml(){
  const pj=pjActive();
  if(!pj){
    return `<button class="pj-wiz" id="pblOpen">
      <span class="t" style="display:block">项目式作业？点这里拆</span>
      <span class="d" style="display:block">水火箭 / 测量旗杆 / 非遗小报……选一个，自动拆成每天的作业</span>
    </button>`;
  }
  const tpl=PBLTPLS.find(t=>t.id===pj.tpl);
  const tasks=pjTasks(pj.id), doneN=tasks.filter(h=>h.done).length, total=tasks.length;
  const next=tasks.filter(h=>!h.done).sort((a,b)=>a.due<b.due?-1:1)[0];
  const allDone=total>0&&doneN===total;
  if(allDone){
    const checks=ensureProjectOutputs(pj,tpl), checked=checks.filter(x=>x.done).length;
    return `<div class="card pj-card">
      <div class="pj-head"><span class="tag">已达成</span><span class="pj-name">${esc(tpl.title)}</span></div>
      <div class="pj-stage"><b>逐项核对最终产出（${checked}/${checks.length}）</b></div>
      ${checks.map((x,i)=>`<button class="output-check ${x.done?"done":""}" data-output="${i}" aria-pressed="${x.done}"><span class="box">${x.done?IC.check:""}</span><span>${esc(x.label)}</span></button>`).join("")}
      <div class="muted" style="margin-bottom:10px">项目任务全部完成，经验 +10 已入账。核对完全部产出后即可完成项目。</div>
      <button class="btn ghost sm" id="pjFinish" ${checked<checks.length?"disabled":""}>${checked<checks.length?"请先核对全部产出":"完成项目"}</button>
    </div>`;
  }
  return `<div class="card pj-card">
    <div class="pj-head"><span class="tag">进行中的项目</span><span class="pj-name">${esc(tpl.title)}</span>
    <button class="hw-del" id="pjEnd" aria-label="结束项目">${IC.trash}</button></div>
    <div class="pj-stage">当前阶段：<b>${esc(next?next.stage:"—")}</b> · 已完成 <b class="num">${doneN}/${total}</b></div>
    <div class="expbar"><i style="width:${total?Math.round(doneN/total*100):0}%"></i></div>
  </div>`;
}
function renderHw(){

      <button class="btn block" id="hwAdd">记下来</button>
    </div>
    </div>
    <div class="col-main">
    <div class="chips" id="hwFilterChips">${chips}</div>
    <div class="muted" style="margin:4px 2px 8px">未完成 ${pend.length} 项 · 已完成 ${done.length} 项</div>
    ${pend.map(hwItem).join("")||'<div class="muted" style="padding:12px 2px">没有未完成的作业。</div>'}
    ${done.length?`<button class="chip" id="toggleDone" aria-expanded="${hwDoneOpen}">${hwDoneOpen?"收起":"展开"}已完成（${done.length}）</button>${hwDoneOpen?done.map(hwItem).join(""):""}`:""}
    </div>
  </div>`;
  let subj="语文";
  $$("#hwSubjChips .chip").forEach(c=>c.onclick=()=>{$$("#hwSubjChips .chip").forEach(x=>x.classList.remove("on")); c.classList.add("on"); subj=c.dataset.s});
  $$("#hwFilterChips .chip").forEach(c=>c.onclick=()=>{hwFilter=c.dataset.f; renderHw()});
  $("#hwAdd").onclick=()=>{

    if(!text){toast("先写点内容"); return}

  $$("#page-hw [data-done]").forEach(b=>b.onclick=()=>{

  $$("#page-hw [data-del]").forEach(b=>b.onclick=()=>{

    }else{b.classList.add("ask"); b.textContent="再点一次删除"; setTimeout(()=>{if(b.isConnected){b.classList.remove("ask"); b.innerHTML=IC.trash}},2000)}

  const wiz=$("#pblOpen"); if(wiz)wiz.onclick=openPbl;

  const pjEnd=$("#pjEnd"); if(pjEnd)pjEnd.onclick=()=>{
    if(pjEnd.classList.contains("ask")){
      const pj=pjActive(); if(pj)endProject(pj.id);

  };
  const pjFin=$("#pjFinish"); if(pjFin)pjFin.onclick=()=>{
    const pj=pjActive(); if(!pj)return;
    state.projects=state.projects.filter(p=>p.id!==pj.id); save(); renderHw(); toast("成果收下，继续加油");
  };
}

/* ==================== 渲染：记忆 ==================== */
let memSub="p", memFilter="all";
function memStatusTag(m){
  if(m.lv>=4)return '<span class="tag gray">已会背</span>';
  if(m.lv===0)return '<span class="tag">未背</span>';
  const due=m.next&&m.next<=today();
  return due?`<span class="tag red">第${m.lv}轮 · 该复习了</span>`:`<span class="tag amber">第${m.lv}轮 · ${dlabel(m.next)}复习</span>`;
}
function memGroup(m){if(m.lv>=4)return"grad";if(m.lv>=1&&m.next&&m.next<=today())return"due";return"learning"}
function renderMem(){
  const filterChips=[['all','全部'],['due','该复习'],['learning','学习中'],['grad','已掌握']].map(x=>`<button class="chip ${memFilter===x[0]?"on":""}" data-mf="${x[0]}">${x[1]}</button>`).join("");
  $("#page-mem").innerHTML=`
  <div class="page-grid">
    <div class="col-side">
      <div class="card ctl-card"><h2>${IC.book}记忆库</h2>
        <div class="subtabs">
          <button class="${memSub==="p"?"on":""}" data-sub="p">古诗文 ${POEMS.length} 篇</button>
          <button class="${memSub==="w"?"on":""}" data-sub="w">单词 ${WORDS.length} 个</button>
        </div>
        <div class="muted" style="margin-bottom:10px">${memSub==="p"?"古诗文按统编版语文教材整理":"单词按义务教育英语课程标准词汇整理"}</div>
        <div class="chips" id="memFilters" style="margin-bottom:0">${filterChips}</div>
      </div>
    </div>
    <div class="col-main"><div id="memList"></div></div>
  </div>`;
  $$("#page-mem [data-sub]").forEach(b=>b.onclick=()=>{memSub=b.dataset.sub; renderMem()});
  $$("#memFilters [data-mf]").forEach(b=>b.onclick=()=>{memFilter=b.dataset.mf;renderMem()});
  const items=(memSub==="p"?POEMS:WORDS).filter(it=>{
    const m=memProg(it.id); return memWrongCount(m)<2&&(memFilter==="all"||memGroup(m)===memFilter);
  });
  const sorted=items.slice().sort((a,b)=>{
    const ma=memProg(a.id), mb=memProg(b.id);
    const da=ma.lv>=1&&ma.lv<=3&&ma.next&&ma.next<=today()?0: ma.lv===0?1: ma.lv>=4?3:2;
    const db=mb.lv>=1&&mb.lv<=3&&mb.next&&mb.next<=today()?0: mb.lv===0?1: mb.lv>=4?3:2;
    return da-db;
  });
  $("#memList").innerHTML=sorted.map(it=>{
    const m=memProg(it.id);
    const title=memSub==="p"?it.title:it.w;
    const sub=memSub==="p"?`${it.dyn} · ${it.author} · ${it.book}`:`${it.ph} ${it.pos}`;
    return `<button class="item mem-item ${m.lv>=4?"grad":""}" data-open="${it.id}" aria-label="打开${esc(title)}，${m.lv>=4?"已掌握":"查看学习内容"}">
      <span class="tx"><span class="t">${esc(title)}</span><span class="s" style="display:block">${esc(sub)}</span></span>
      ${memStatusTag(m)}<span class="arrow" aria-hidden="true">${IC.right}</span>
    </button>`;
  }).join("")||'<div class="muted" style="padding:12px 2px">这个分组暂时没有内容。</div>';
  $$("#page-mem [data-open]").forEach(b=>b.onclick=()=>openMemCard(b.dataset.open));
}

let memCardId=null, memMasked=false;

}
function drawMemCard(){
  const isP=memCardId.startsWith("p");
  const it=isP?POEMS.find(x=>x.id===memCardId):WORDS.find(x=>x.id===memCardId);
  const m=memProg(memCardId);
  $("#memOvTitle").textContent=m.lv>=1&&m.lv<=3?`第 ${m.lv} 轮复习`:(m.lv>=4?"已会背":"新内容");
  const canSpeak="speechSynthesis" in window;
  if(isP){
    $("#memOvBody").innerHTML=`
      <h2 style="text-align:center;font-size:22px;margin-bottom:2px">${esc(it.title)}</h2>
      <div class="poem-author">${esc(it.dyn)} · ${esc(it.author)}</div>

      <div class="tool-row">
        ${canSpeak?`<button class="btn ghost sm" id="speakBtn">${IC.speaker} 读给我听</button>`:""}

      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(it.title+"。 "+it.lines.join(" ")); u.lang="zh-CN"; u.rate=0.85;
      speechSynthesis.speak(u);
    };
    $("#maskBtn").onclick=()=>{memMasked=!memMasked; drawMemCard()};
    if(memMasked)$$("#poemText .ln").forEach(l=>{l.classList.add("masked");l.setAttribute("role","button");l.tabIndex=0;l.setAttribute("aria-label","揭开这一句");const reveal=()=>l.classList.remove("masked");l.onclick=reveal;l.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();reveal()}}});
  }else{
    $("#memOvBody").innerHTML=`
      <div class="word-card" id="wordCard" role="button" tabindex="0" aria-label="翻面查看释义"><div class="word-inner">
        <div class="word-face"><div class="w">${esc(it.w)}</div><div class="ph num">${esc(it.ph)}</div>
          ${canSpeak?`<button class="btn ghost sm" id="speakBtn">${IC.speaker} 读一下</button>`:""}
        </div>
        <div class="word-face back"><div class="pos">${esc(it.pos)}</div><div class="def">${esc(it.def)}</div></div>
      </div></div>
      <div class="word-hint">点卡片翻面看释义</div>
    `;
    const flipCard=e=>{if(e.target.closest&&e.target.closest("#speakBtn"))return;$("#wordCard").classList.toggle("flipped")};
    $("#wordCard").onclick=flipCard; $("#wordCard").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flipCard(e)}};
    if(canSpeak)$("#speakBtn").onclick=()=>{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(it.w); u.lang="en-US"; u.rate=0.85;
      speechSynthesis.speak(u);
    };
  }
  const grad=m.lv>=4, canAct=memCanAct(m);
  if(grad){
    $("#memOvFoot").innerHTML=`<button class="btn ghost" data-close="memOverlay" style="flex:1">已经会背了，返回</button>`;
  }else if(!canAct){
    const msg=memWrongCount(m)>=2?"今天已忘记两次，明天再来":"下次复习："+dlabel(m.next);
    $("#memOvFoot").innerHTML=`<div style="flex:1;text-align:center"><div style="font-weight:700;margin-bottom:8px">${msg}</div><div class="muted">现在仍可查看、朗读和遮字练习，复习操作将在到期后开放。</div></div>`;
  }else{
    const okLabel=m.lv===0?(isP?"背过了":"会了"):"复习通过";
    $("#memOvFoot").innerHTML=`
      <button class="btn red" id="memForgot">忘了</button>
      <button class="btn" id="memOk">${okLabel}</button>
    `;
    $("#memForgot").onclick=()=>{
      speechSynthesisCancel();
      memAction(memCardId,false); addExp(0,null);
      pushMemory(memCardId);
      const count=memWrongCount(memProg(memCardId));
      closeOverlay("memOverlay"); renderAll();
      toast(count>=2?"今天已练习两次，明天再来":"先看一遍，今天还可以再试一次");
    };
    $("#memOk").onclick=()=>{

      closeOverlay("memOverlay"); addExp(exp,lt); renderAll();
    };
  }
  $$("#memOvFoot [data-close]").forEach(b=>b.onclick=()=>{speechSynthesisCancel(); closeOverlay(b.dataset.close)});

  });
  $$("#mkList [data-yes]").forEach(b=>b.onclick=()=>{mkAction(b.dataset.yes,true); addExp(2,"mr"); renderAll()});
  $$("#mkList [data-no]").forEach(b=>b.onclick=()=>{mkAction(b.dataset.no,false); save(); renderAll(); toast("没关系，明天再来一轮")});
  $$("#mkList [data-mkdel]").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("ask")){const mkId=b.dataset.mkdel; state.mistakes=state.mistakes.filter(x=>x.id!==mkId); deleteRemoteMistake(mkId); save(); renderAll(); toast("已删除")}
    else{b.classList.add("ask"); b.textContent="再点一次删除"; setTimeout(()=>{if(b.isConnected){b.classList.remove("ask"); b.innerHTML=IC.trash}},2000)}
  });
}

/* ==================== 战报 ==================== */
function weekDates(offsetWeeks=0){
  const now=new Date(today()+"T12:00:00"), weekday=(now.getDay()+6)%7;
  const start=addDays(today(),-weekday+offsetWeeks*7), count=weekday+1, out=[];
  for(let i=0;i<count;i++)out.push(addDays(start,i)); return out;
}
function statsForDates(ds){
  const set=new Set(ds), logs=state.log.filter(l=>set.has(l.d)), cnt=t=>logs.filter(l=>l.t===t).length;
  return {days:ds.filter(d=>state.checkins.includes(d)).length,hw:cnt("hw"),pn:cnt("pn"),wn:cnt("wn"),mr:cnt("mr"),heat:ds.map(d=>({d,on:state.checkins.includes(d)}))};
}
function weekStats(){return statsForDates(weekDates())}
function previousWeekStats(){return statsForDates(weekDates(-1))}
function compareText(now,prev){const diff=now-prev;return diff===0?"与上周同期持平":diff>0?`比上周同期多 ${diff}`:`比上周同期少 ${Math.abs(diff)}`}
function openReport(){
  const st=weekStats(), prev=previousWeekStats(), lv=levelOf(state.exp), streak=calcStreak();
  const memTotal=POEMS.length+WORDS.length;
  const wd=["日","一","二","三","四","五","六"];
  $("#repOvBody").innerHTML=`
    <div class="card" style="text-align:center">
      <div class="muted">连续学习</div>
      <div style="font-size:52px;font-weight:800;color:var(--orange);line-height:1.1" class="num">${streak}<span style="font-size:18px"> 天</span></div>
      <div class="muted">当前称号「${lv.name}」 · 经验 <span class="num">${state.exp}</span></div>
    </div>
    <div class="card"><h2>${IC.chart}本周打卡</h2>
      <div class="heat">${st.heat.map(h=>{const dt=new Date(h.d+"T12:00:00"); return `<div class="hcell"><div class="sq ${h.on?"lv3":""}">${h.on?'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>':""}</div><div class="wd">${wd[dt.getDay()]}</div></div>`}).join("")}</div>
    </div>
    <div class="rep-grid">
      <div class="rep-cell"><div class="n num">${st.hw}</div><div class="l">完成作业（项）</div><div class="compare">${compareText(st.hw,prev.hw)}</div></div>
      <div class="rep-cell"><div class="n num">${st.pn+st.wn}</div><div class="l">新背会（篇/个）</div><div class="compare">${compareText(st.pn+st.wn,prev.pn+prev.wn)}</div></div>
      <div class="rep-cell"><div class="n num">${st.mr}</div><div class="l">错题复习（次）</div><div class="compare">${compareText(st.mr,prev.mr)}</div></div>
      <div class="rep-cell"><div class="n num">${st.days}</div><div class="l">本周打卡（天）</div><div class="compare">${compareText(st.days,prev.days)}</div></div>
    </div>
    <button class="btn block" id="mkPoster">生成战报海报（PNG）</button>
    <div id="posterWrap" style="margin-top:14px;display:none">
      <img id="posterImg" alt="本周战报海报">
      <div class="muted" style="text-align:center;margin-top:8px">长按图片可保存 / 转发</div>
    </div>
    <canvas id="posterCanvas" width="750" height="1000"></canvas>
  `;
  openLayer("repOverlay");
  $("#mkPoster").onclick=()=>{
    try{
      drawPoster();
      const url=$("#posterCanvas").toDataURL("image/png");
      $("#posterImg").src=url; $("#posterWrap").style.display="block";
      const a=document.createElement("a"); a.href=url; a.download="学习战报-"+today()+".png";
      document.body.appendChild(a); a.click(); a.remove();
      toast("海报已开始下载");
    }catch(e){toast("生成失败，可以长按截图保存")}
  };
}
function drawPoster(){
  const c=$("#posterCanvas"), ctx=c.getContext("2d");
  const st=weekStats(), prev=previousWeekStats(), lv=levelOf(state.exp), streak=calcStreak();
  const memTotal=POEMS.length+WORDS.length, memPc=memGradCount()/memTotal;
  const mkTotal=state.mistakes.length, mkPc=mkTotal?mkMastered()/mkTotal:0;
  // 背景
  ctx.fillStyle="#FAF7F0"; ctx.fillRect(0,0,750,1000);
  ctx.fillStyle="#0F766E"; ctx.fillRect(0,0,750,14);
  // 标题
  ctx.fillStyle="#292524"; ctx.font="700 34px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.textAlign="center"; ctx.fillText("学 习 战 报",375,78);
  ctx.fillStyle="#78716C"; ctx.font="400 20px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  const ds=weekDates();
  ctx.fillText(ds[0].replace(/-/g,".")+" - "+ds[ds.length-1].replace(/-/g,"."),375,112);
  // 连续天数
  ctx.fillStyle="#EA580C"; ctx.font="800 120px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.fillText(String(streak),375,258);
  ctx.fillStyle="#78716C"; ctx.font="600 24px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.fillText("连续学习天数",375,296);
  // 称号徽章
  ctx.fillStyle="#0F766E"; roundRect(ctx,265,322,220,52,26); ctx.fill();
  ctx.fillStyle="#FFFFFF"; ctx.font="700 26px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.fillText("Lv."+(lv.idx+1)+" "+lv.name,375,357);
  // 热力格
  const wd=["日","一","二","三","四","五","六"];
  st.heat.forEach((h,i)=>{
    const x=75+i*88, y=420;
    ctx.fillStyle=h.on?"#0F766E":"#EDE8DD"; roundRect(ctx,x,y,72,60,12); ctx.fill();
    if(h.on){ctx.strokeStyle="#fff"; ctx.lineWidth=5; ctx.lineCap="round"; ctx.lineJoin="round";
      ctx.beginPath(); ctx.moveTo(x+22,y+31); ctx.lineTo(x+33,y+42); ctx.lineTo(x+51,y+20); ctx.stroke();}
    const dt=new Date(h.d+"T12:00:00");
    ctx.fillStyle="#78716C"; ctx.font="400 18px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillText(wd[dt.getDay()],x+36,y+88);
  });
  // 双环
  ring(ctx,200,620,70,memPc,"#0F766E","记忆毕业");
  ring(ctx,550,620,70,mkPc,"#EA580C","错题掌握");
  // 四格数据
  const shortCmp=(a,b)=>a===b?"持平":a>b?"较上周 +"+(a-b):"较上周 -"+(b-a);
  const cells=[["完成作业 · "+shortCmp(st.hw,prev.hw),st.hw+" 项"],["新背会 · "+shortCmp(st.pn+st.wn,prev.pn+prev.wn),(st.pn+st.wn)+" 篇/个"],["错题复习 · "+shortCmp(st.mr,prev.mr),st.mr+" 次"],["本周打卡 · "+shortCmp(st.days,prev.days),st.days+" 天"]];
  cells.forEach((cell,i)=>{
    const x=75+(i%2)*310, y=750+Math.floor(i/2)*92;
    ctx.fillStyle="#FFFFFF"; roundRect(ctx,x,y,290,76,14); ctx.fill();
    ctx.strokeStyle="#EDE8DD"; ctx.lineWidth=2; roundRect(ctx,x,y,290,76,14); ctx.stroke();
    ctx.fillStyle="#0F766E"; ctx.font="800 28px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign="left"; ctx.fillText(cell[1],x+24,y+38);
    ctx.fillStyle="#78716C"; ctx.font="400 17px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.fillText(cell[0],x+24,y+62); ctx.textAlign="center";
  });
  // 底部
  ctx.fillStyle="#78716C"; ctx.font="400 18px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.fillText("中二学习台 · 每天进步一点点",375,962);
}
function ring(ctx,cx,cy,r,pc,color,label){
  ctx.lineWidth=16; ctx.lineCap="round";
  ctx.strokeStyle="#EDE8DD"; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  if(pc>0){ctx.strokeStyle=color; ctx.beginPath(); ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*pc); ctx.stroke();}
  ctx.fillStyle="#292524"; ctx.font="800 30px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.textAlign="center"; ctx.fillText(Math.round(pc*100)+"%",cx,cy+10);
  ctx.fillStyle="#78716C"; ctx.font="400 18px -apple-system,'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.fillText(label,cx,cy+r+34);
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath()}

/* ==================== PBL 项目向导 ==================== */
let pblTplId=null;
function openPbl(){pblTplId=null; drawPbl(); openLayer("pblOverlay")}
function drawPbl(){
  const body=$("#pblOvBody");
  if(!pblTplId){
    $("#pblOvTitle").textContent="选一个项目";
    body.innerHTML=`
      <div class="muted" style="margin-bottom:12px">学校布置的项目式作业不会做？选一个，自动拆成每天的小任务，照着做就行。</div>
      ${PBLTPLS.map(t=>{
        const n=t.stages.reduce((s,x)=>s+x.tasks.length,0);
        return `<button class="item tpl-item" data-tpl="${t.id}">
          <span class="row1"><span class="tag">${esc(t.subject)}</span><span class="tag amber">${t.days} 天 · ${n} 项任务</span></span>
          <span style="font-weight:800;margin-top:6px;display:block">${esc(t.title)}</span>
          <span class="goal" style="display:block">${esc(t.goal)}</span>
        </button>`;
      }).join("")}
    `;
    $$("#pblOvBody [data-tpl]").forEach(b=>b.onclick=()=>{pblTplId=b.dataset.tpl; drawPbl()});
    return;
  }
  const t=PBLTPLS.find(x=>x.id===pblTplId);
  $("#pblOvTitle").textContent=t.title;
  body.innerHTML=`
    <div class="pbl-sec"><div class="lb">项目目标</div><div>${esc(t.goal)}</div></div>
    <div class="pbl-sec"><div class="lb">最终产出</div><div>${esc(t.output)}</div></div>
    <div class="pbl-sec"><div class="lb">涉及知识点</div><div class="chips">${t.knowledge.map(k=>`<span class="chip" style="cursor:default">${esc(k)}</span>`).join("")}</div></div>
    <div class="pbl-sec"><div class="pbl-safety">安全提示：${esc(t.safety)}</div></div>
    <div class="pbl-sec"><div class="lb">阶段地图（共 ${t.days} 天）</div>
      ${t.stages.map((s,i)=>`
        <div class="pbl-stage-h"><span class="no">${i+1}</span><span class="nm">${esc(s.name)}</span></div>
        ${s.tasks.map(tk=>`<div class="pbl-task"><span class="day">第${tk.day}天</span><span>${esc(tk.text)}</span></div>`).join("")}
      `).join("")}
    </div>
    <div class="form-row" style="margin-top:18px"><label>哪天开始</label><input type="date" id="pblStart" value="${addDays(today(),1)}"></div>
    <button class="btn block" id="pblGo">拆成每日任务</button>
  `;
  $("#pblGo").onclick=()=>{
    const start=$("#pblStart").value;
    if(!start){toast("选个开始日期"); return}
    startProject(pblTplId,start);
  };
}
function startProject(tplId,start){
  const tpl=PBLTPLS.find(t=>t.id===tplId); if(!tpl)return;
  const pj={id:uid(),tpl:tplId,start,created:today()};
  state.projects.push(pj);
  let n=0;
  tpl.stages.forEach(st=>st.tasks.forEach(tk=>{
    state.homework.push({id:uid(),subj:"项目·"+tpl.subject,text:tk.text,due:addDays(start,tk.day-1),done:false,created:today(),project:pj.id,stage:st.name});
    n++;
  }));
  save(); closeOverlay("pblOverlay"); renderAll(); switchTab("hw");
  toast("已拆成 "+n+" 项任务，从 "+dlabel(start)+" 开始");
}
function checkProjectDone(pjId){
  const pj=state.projects.find(p=>p.id===pjId); if(!pj||pj.celebrated)return;
  const tasks=pjTasks(pjId);
  if(tasks.length&&tasks.every(h=>h.done)){
    pj.celebrated=true;
    addExp(10,null);
    const tpl=PBLTPLS.find(t=>t.id===pj.tpl);
    setTimeout(()=>toast("项目达成："+(tpl?tpl.title:"")),600);
  }
}
function endProject(pjId){
  state.homework=state.homework.filter(h=>!(h.project===pjId&&!h.done));
  state.projects=state.projects.filter(p=>p.id!==pjId);
  save(); renderHw(); toast("项目已结束，未做的任务已删");
}

/* ==================== 设置/备份/清空 ==================== */
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
const layerReturnFocus=new Map();
function focusables(el){return Array.from(el.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[href],[tabindex]:not([tabindex="-1"])')).filter(x=>x.offsetParent!==null)}
function openLayer(id){const el=$("#"+id);layerReturnFocus.set(id,document.activeElement);el.classList.add("on");requestAnimationFrame(()=>{const fs=focusables(el);if(fs[0])fs[0].focus()})}
function closeLayer(id){const el=$("#"+id);el.classList.remove("on");const back=layerReturnFocus.get(id);layerReturnFocus.delete(id);if(back&&back.isConnected)back.focus()}
function openDrawer(){layerReturnFocus.set("drawer",document.activeElement);$("#drawer").classList.add("on");$("#drawerMask").classList.add("on");requestAnimationFrame(()=>$("#drawerClose").focus())}
function closeDrawer(){$("#drawer").classList.remove("on");$("#drawerMask").classList.remove("on");const back=layerReturnFocus.get("drawer");layerReturnFocus.delete("drawer");if(back&&back.isConnected)back.focus()}
function closeOverlay(id){closeLayer(id)}
function trapLayerKey(e){
  const layer=[...$$('.overlay.on'),$("#drawer").classList.contains("on")?$("#drawer"):null].filter(Boolean).pop();if(!layer)return;
  if(e.key==="Escape"){e.preventDefault();layer.id==="drawer"?closeDrawer():closeOverlay(layer.id);return}
  if(e.key!=="Tab")return;const fs=focusables(layer);if(!fs.length){e.preventDefault();return}const first=fs[0],last=fs[fs.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
}
function validDate(s,nullable=false){
  if(nullable&&s===null)return true;
  if(typeof s!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;
  const d=new Date(s+"T12:00:00"); return !Number.isNaN(d.getTime())&&dstr(d)===s;
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download="学习台备份-"+today()+".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast("已导出 JSON 备份");
}
function importJSONFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const obj=JSON.parse(reader.result);
      migrateState(obj); save(); renderAll();
      toast("已导入备份数据");
    }catch(e){ toast("导入失败：文件格式不正确"); }
  };
  reader.readAsText(file);
}
function bindSettings(){
  $("#gearBtn").onclick=openDrawer;
  $("#drawerClose").onclick=closeDrawer;
  $("#drawerMask").onclick=closeDrawer;
  document.addEventListener("keydown",trapLayerKey);
  $$("[data-close]").forEach(b=>{if(!b.closest("#memOvFoot"))b.onclick=()=>{speechSynthesisCancel(); closeOverlay(b.dataset.close)}});
  $$(".overlay").forEach(ov=>ov.addEventListener("click",e=>{if(e.target===ov){speechSynthesisCancel(); closeOverlay(ov.id)}}));
  $("#clearSampleBtn").onclick=()=>{if(confirm("清空示例数据？你自己记录的内容不受影响。")){clearSample(); closeDrawer()}};
  $("#exportBtn").onclick=exportJSON;
  $("#importBtn").onclick=()=>$("#importFile").click();
  $("#importFile").onchange=e=>{ if(e.target.files&&e.target.files[0]) importJSONFile(e.target.files[0]); e.target.value=""; };
  // 长按 3 秒清空
  const btn=$("#clearAllBtn"), prog=btn.querySelector(".prog"), lb=btn.querySelector(".lb");
  let timer=null, tick=null, start=0;
  const reset=()=>{clearTimeout(timer); clearInterval(tick); prog.style.width="0%"; lb.textContent="长按 3 秒清空"};
  const startHold=e=>{
    e.preventDefault(); start=Date.now();
    tick=setInterval(()=>{prog.style.width=Math.min(100,(Date.now()-start)/30)+"%"},30);
    timer=setTimeout(()=>{
      reset(); state=defaultState(); save(); closeDrawer(); renderAll();
      toast("已清空全部数据");
    },3000);
  };
  btn.addEventListener("pointerdown",startHold);
  btn.addEventListener("pointerup",reset);
  btn.addEventListener("pointerleave",reset);
  btn.addEventListener("contextmenu",e=>e.preventDefault());
}

/* ==================== 启动 ==================== */
function renderAll(){renderStreak(); renderToday(); renderHw(); renderMem(); renderMk(); renderNav()}
load(); bindSettings(); renderAll(); switchTab("today");
pullRemote(function(ok,n){if(ok&&n){renderHw();renderStreak();console.log('[database] pulled '+n+' homework records')}});
pullRemoteMemory(function(ok,n){if(ok&&n){renderMem();console.log('[database] pulled '+n+' memory records')}});
pullRemoteMistakes(function(ok,n){if(ok&&n){renderMk();console.log('[database] pulled '+n+' mistake records')}});
</script>
